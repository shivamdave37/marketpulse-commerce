services:
  - name: marketpulse-web
    type: web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: marketpulse-db
          property: connectionString
      - key: DEFAULT_USER_ID
        value: 11111111-1111-1111-1111-111111111111

databases:
  - name: marketpulse-db
    plan: free
    region: singapore
    databaseName: marketpulse
    user: marketpulse_user
